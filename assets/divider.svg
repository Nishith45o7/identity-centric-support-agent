<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="1200" height="30" role="img" aria-label="divider">
<defs><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#6366f1" stop-opacity="0"/><stop offset=".3" stop-color="#6366f1"/>
<stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="14" width="1200" height="2" rx="1" fill="url(#l)" opacity=".6"/>
<circle r="4" cy="15" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="-20;1220" dur="5s" repeatCount="indefinite"/></circle>
<g transform="translate(600,15)"><rect x="-7" y="-7" width="14" height="14" fill="#0b1020" stroke="#818cf8" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="45;225;405" dur="6s" repeatCount="indefinite"/></rect>
<circle r="2.5" fill="#22d3ee"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle></g>
</svg>
