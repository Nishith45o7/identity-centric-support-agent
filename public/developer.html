<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Dashboard</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: #101b2d;
        --panel-alt: #0d1727;
        --border: rgba(148, 163, 184, 0.25);
        --text: #e5eefb;
        --muted: #9bb0d1;
        --primary: #7dd3fc;
        --primary-strong: #38bdf8;
        --success: #4ade80;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow: rgba(15, 23, 42, 0.5);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020817 0%, #0f172a 100%);
        color: var(--text);
      }
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }
      .eyebrow {
        margin: 0 0 8px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--primary);
        font-size: 0.72rem;
      }
      h1 { margin: 0; font-size: clamp(2rem, 3vw, 3rem); }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 14px 30px var(--shadow);
      }
      .entity-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .entity-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.78);
        padding: 12px;
      }
      .entity-meta {
        color: var(--muted);
        font-size: 0.76rem;
        margin-top: 6px;
      }
      .inline-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .secondary {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .danger {
        background: rgba(248, 113, 113, 0.15);
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.4);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }
      .value {
        margin-top: 10px;
        font-size: clamp(1.7rem, 2vw, 2.4rem);
        font-weight: 700;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 18px;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      input, button {
        font: inherit;
      }
      input {
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
      }
      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #082035;
        padding: 11px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 420px;
        overflow: auto;
      }
      .event {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
      }
      .event strong { display: block; margin-bottom: 4px; }
      .muted { color: var(--muted); }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      @media (max-width: 900px) {
        .grid, .layout { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Developer Console</p>
          <h1>Developer Dashboard</h1>
        </div>
        <a href="/" style="color: var(--text); text-decoration: none; border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.03);">← Support Agent</a>
      </header>

      <section class="grid">
        <div class="card">
          <div class="label">Tenants</div>
          <div class="value" id="tenant-count">0</div>
        </div>
        <div class="card">
          <div class="label">Active Keys</div>
          <div class="value" id="active-key-count">0</div>
        </div>
        <div class="card">
          <div class="label">Events</div>
          <div class="value" id="event-count">0</div>
        </div>
      </section>

      <section class="layout">
        <div class="card">
          <h2>Create Tenant</h2>
          <form id="tenant-form">
            <label>
              Tenant ID
              <input name="tenantId" value="tenant_acme" placeholder="tenant_acme" required />
            </label>
            <label>
              Name
              <input name="name" value="Acme Support" placeholder="Acme Support" required />
            </label>
            <label>
              Owner Email
              <input name="ownerEmail" value="ops@acme.example" placeholder="ops@acme.example" />
            </label>
            <button type="submit">Create Tenant</button>
          </form>

          <div style="margin-top: 18px;">
            <h3>Key Issuance</h3>
            <form id="key-form">
              <label>
                App Name
                <input name="name" value="Support Console" placeholder="Support Console" required />
              </label>
              <label>
                Environment
                <input name="environment" value="test" placeholder="test" />
              </label>
              <label>
                Tenant ID
                <input name="tenantId" value="tenant_acme" placeholder="tenant_acme" required />
              </label>
              <label>
                Role
                <select name="role" style="border: 1px solid var(--border); background: rgba(15, 23, 42, 0.8); color: var(--text); border-radius: 10px; padding: 10px 12px;">
                  <option value="admin">Admin</option>
                  <option value="viewer">Viewer</option>
                </select>
              </label>
              <button type="submit">Create Key</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h2>Audit Trail</h2>
          <div id="audit-list" class="list">
            <div class="muted">Loading events...</div>
          </div>
        </div>
      </section>

      <section class="layout" style="margin-top: 18px;">
        <div class="card">
          <h2>Tenant Directory</h2>
          <div id="tenant-list" class="entity-list"></div>
        </div>
        <div class="card">
          <h2>Key Directory</h2>
          <div id="key-list" class="entity-list"></div>
        </div>
      </section>
    </div>

    <script>
      const summaryUrl = '/v1/developer/summary';
      const auditUrl = '/v1/developer/audit';

      async function fetchJson(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || 'Request failed');
        }
        return data;
      }

      const renderSummary = (summary) => {
        document.getElementById('tenant-count').textContent = summary.tenantCount ?? 0;
        document.getElementById('active-key-count').textContent = summary.activeKeyCount ?? 0;
        document.getElementById('event-count').textContent = summary.eventCount ?? 0;
      };

      const renderAudit = (events = []) => {
        const list = document.getElementById('audit-list');
        if (!events.length) {
          list.innerHTML = '<div class="muted">No events yet.</div>';
          return;
        }

        list.innerHTML = events.map((event) => `
          <div class="event">
            <strong>${event.type}</strong>
            <div class="muted">${event.message || 'No message'}</div>
            <div class="mono" style="margin-top:8px; font-size: 0.75rem;">${event.tenantId || 'default'} • ${new Date(event.createdAt).toLocaleString()}</div>
          </div>
        `).join('');
      };

      const renderTenants = (tenants = []) => {
        const list = document.getElementById('tenant-list');
        if (!tenants.length) {
          list.innerHTML = '<div class="muted">No tenants yet.</div>';
          return;
        }

        list.innerHTML = tenants.map((tenant) => `
          <div class="entity-item">
            <strong>${tenant.name || tenant.tenantId}</strong>
            <div class="entity-meta">${tenant.tenantId} • ${tenant.status || 'active'}</div>
            <div class="entity-meta">Owner: ${tenant.ownerEmail || 'unassigned'}</div>
            <div class="inline-actions">
              <button class="secondary" type="button" data-action="update-tenant" data-tenant-id="${tenant.tenantId}">Edit</button>
            </div>
          </div>
        `).join('');
      };

      const renderKeys = (keys = []) => {
        const list = document.getElementById('key-list');
        if (!keys.length) {
          list.innerHTML = '<div class="muted">No keys yet.</div>';
          return;
        }

        list.innerHTML = keys.map((key) => `
          <div class="entity-item">
            <strong>${key.name}</strong>
            <div class="entity-meta">${key.id} • ${key.tenantId} • ${key.role || 'admin'} • ${key.status}</div>
            <div class="entity-meta mono">${key.environment}</div>
            <div class="inline-actions">
              <button class="secondary" type="button" data-action="change-role" data-key-id="${key.id}" data-role="${key.role || 'admin'}">Toggle Role</button>
              <button class="danger" type="button" data-action="revoke-key" data-key-id="${key.id}">Revoke</button>
            </div>
          </div>
        `).join('');
      };

      async function loadDashboard() {
        try {
          const [summaryData, auditData, tenantData, keyData] = await Promise.all([
            fetchJson(summaryUrl),
            fetchJson(auditUrl),
            fetchJson('/v1/developer/tenants'),
            fetchJson('/v1/developer/keys'),
          ]);

          renderSummary(summaryData.summary || {});
          renderAudit(auditData.events || []);
          renderTenants(tenantData.tenants || []);
          renderKeys(keyData.keys || []);
        } catch (error) {
          document.getElementById('audit-list').innerHTML = '<div class="muted">Unable to load audit events.</div>';
        }
      }

      document.getElementById('tenant-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const payload = Object.fromEntries(formData.entries());

        await fetchJson('/v1/developer/tenants', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        event.currentTarget.reset();
        await loadDashboard();
      });

      document.getElementById('key-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        const payload = Object.fromEntries(formData.entries());

        const response = await fetchJson('/v1/developer/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const keyValue = response.key || '';
        const message = keyValue ? `New key: ${keyValue}` : 'Key created';
        document.getElementById('audit-list').innerHTML = `<div class="event"><strong>Key created</strong><div class="mono">${message}</div></div>`;
        await loadDashboard();
      });

      document.addEventListener('click', async (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        const keyId = target.dataset.keyId;
        const tenantId = target.dataset.tenantId;

        if (action === 'change-role') {
          const nextRole = target.dataset.role === 'admin' ? 'viewer' : 'admin';
          await fetchJson(`/v1/developer/keys/${keyId}/role`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: nextRole }),
          });
          await loadDashboard();
        }

        if (action === 'revoke-key') {
          await fetchJson(`/v1/developer/keys/${keyId}`, {
            method: 'DELETE',
          });
          await loadDashboard();
        }

        if (action === 'update-tenant') {
          const tenant = (await fetchJson('/v1/developer/tenants')).tenants.find((item) => item.tenantId === tenantId);
          const nextName = window.prompt('Tenant name', tenant?.name || tenantId);
          if (nextName === null) return;
          const nextOwnerEmail = window.prompt('Owner email', tenant?.ownerEmail || '');
          if (nextOwnerEmail === null) return;
          await fetchJson(`/v1/developer/tenants/${tenantId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nextName, ownerEmail: nextOwnerEmail }),
          });
          await loadDashboard();
        }
      });

      loadDashboard();
    </script>
  </body>
</html>
