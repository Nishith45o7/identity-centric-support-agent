<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · Contextis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070d1e;
        --card-bg: rgba(13, 23, 49, 0.75);
        --border: rgba(148, 163, 184, 0.15);
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.25);
        --text: #f8fafc;
        --muted: #94a3b8;
        --red: #f87171;
        --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
        --mono: 'JetBrains Mono', monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: var(--sans);
        background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                    radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                    var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      header {
        height: 72px;
        padding: 0 clamp(20px, 6vw, 80px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(7, 13, 30, 0.6);
        backdrop-filter: blur(16px);
      }
      a { color: inherit; text-decoration: none; }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
        color: #031525;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 15px;
      }
      .home-link {
        font-size: 13px;
        color: var(--muted);
        transition: color 0.15s ease;
      }
      .home-link:hover { color: var(--accent); }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 20px rgba(56, 189, 248, 0.05);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--accent);
        margin-bottom: 8px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 24px;
        line-height: 1.5;
      }
      form { display: grid; gap: 16px; }
      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      input {
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
        padding: 0 14px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input:focus { border-color: var(--accent); }
      button {
        height: 46px;
        border-radius: 12px;
        border: 0;
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        color: #031525;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        margin-top: 4px;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error {
        min-height: 18px;
        color: var(--red);
        font-size: 12px;
      }
      .foot {
        margin-top: 24px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      .foot a {
        color: var(--accent);
        font-weight: 600;
      }
      .foot a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/"><span class="mark">C</span> Contextis</a>
      <a class="home-link" href="/">Back to home</a>
    </header>
    <main>
      <section class="card" aria-labelledby="title">
        <div class="eyebrow">Developer workspace</div>
        <h1 id="title">Welcome back.</h1>
        <p class="sub">Sign in to manage your Contextis projects and API keys.</p>
        <form id="login-form">
          <label>Email
            <input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="developer@company.com" />
          </label>
          <label>Password
            <input name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="••••••••••••" />
          </label>
          <div class="error" id="error" role="alert"></div>
          <button id="submit" type="submit">Log in</button>
        </form>
        <p class="foot">New to Contextis? <a href="/signup">Create an account</a></p>
      </section>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
