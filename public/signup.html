<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create your workspace · Continuity API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#172522; --muted:#65736e; --paper:#f4f5ef; --line:#dce3dc; --green:#146b54; --red:#a73826; --mono:'DM Mono',monospace; --sans:'Manrope',sans-serif; }
      *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 30%,#f8e8dd,transparent 34%),radial-gradient(ellipse at 15% 70%,#e0eee5,transparent 42%),var(--paper);color:var(--ink);font-family:var(--sans)}header{height:68px;padding:0 6vw;display:flex;align-items:center;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font-size:14px;font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:27px;height:27px;background:var(--green);color:#fff;display:grid;place-items:center;border-radius:6px;font:13px var(--mono)}main{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:38px 20px}.wrap{width:min(100%,420px)}.eyebrow{color:var(--green);font:11px var(--mono);text-transform:uppercase}.wrap h1{font-size:34px;letter-spacing:0;margin:12px 0 8px}.sub{color:var(--muted);font-size:14px;margin:0 0 27px}form{display:grid;gap:15px}label{display:grid;gap:7px;font-size:12px;font-weight:700}input{height:45px;border:1px solid #ccd6cf;border-radius:4px;background:#fff;padding:0 12px;font:14px var(--sans);color:var(--ink)}input:focus{outline:2px solid #91c7af;outline-offset:1px}button{height:46px;border:0;border-radius:4px;background:var(--green);color:#fff;font:700 13px var(--sans);cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:18px;color:var(--red);font-size:12px}.foot{margin-top:22px;color:var(--muted);font-size:12px}.foot a{color:var(--green);font-weight:700}.fine{font-size:11px;color:var(--muted);line-height:1.6}.home{margin-left:auto;color:var(--muted);font-size:12px}
    </style>
  </head>
  <body>
    <header><a class="brand" href="/"><span class="mark">ic</span> Continuity API</a><a class="home" href="/">Back to home</a></header>
    <main><section class="wrap" aria-labelledby="title"><div class="eyebrow">Start with a project</div><h1 id="title">Create your workspace.</h1><p class="sub">Your first project and test key are a few steps away.</p>
      <form id="signup-form"><label>Your name<input name="name" autocomplete="name" required minlength="1" maxlength="120" /></label><label>Work email<input name="email" type="email" autocomplete="email" required maxlength="254" /></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256" aria-describedby="password-note" /></label><div class="fine" id="password-note">Use at least 12 characters. Passwords are stored as scrypt hashes.</div><div class="error" id="error" role="alert"></div><button id="submit" type="submit">Create account</button></form>
      <p class="foot">Already registered? <a href="/login">Log in</a></p>
    </section></main>
    <script>
      const form=document.getElementById('signup-form');
      fetch('/v1/auth/session').then(r=>r.json()).then(d=>{if(d.user)location.replace('/dashboard')}).catch(()=>{});
      form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');const error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/v1/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'Unable to create account.');location.assign('/dashboard')}catch(err){error.textContent=err.message}finally{button.disabled=false}});
    </script>
  </body>
</html>
